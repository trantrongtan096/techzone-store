server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=techzone_db;encrypt=true;trustServerCertificate=true
    username: your-db-username
    password: your-db-password

techzone:
  cors:
    allowed-origins: http://localhost:4200,https://techzone.vn,https://admin.techzone.vn
  jwt:
    secret: replace-with-a-long-random-secret-at-least-32-characters
    expiration-ms: 86400000
  payment:
    webhook-secret: replace-with-a-long-random-webhook-secret
    vietqr:
      bank-bin: "970436"
      account-no: "1234567890"
      account-name: "TECHZONE STORE"
      template: compact2
