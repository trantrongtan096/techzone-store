server:
  port: 8080

spring:
  application:
    name: techzone-backend

  # Configured for MS SQL Server
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=techzone_db;encrypt=true;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:123456}

    # H2 In-Memory option:
    # url: jdbc:h2:mem:techzonedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    # driver-class-name: org.h2.Driver
    # username: sa
    # password: 

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_nationalized_character_data: true

techzone:
  jwt:
    secret: ${JWT_SECRET:change-this-local-development-secret-to-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
